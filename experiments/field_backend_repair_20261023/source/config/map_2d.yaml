# Reused parallel PMF + SOR + local ground-relative obstacle heights.
# Set up_in_map from an independently verified gravity/reference direction,
# OR explicitly confirm map Z. No reference is guessed from the tilted map.
map_z_confirmed: false
up_in_map: null
method: pmf
resolution: 0.05
padding: 1.0
voxel_leaf: 0.10
threads: 4
max_window_size: 32
slope: 1.0
initial_distance: 0.20
max_distance: 2.5
mean_k: 20
stddev_mul: 1.0
h_min: 0.10
h_max: 1.5
min_obstacle_points: 3
